services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: video_meetings
      POSTGRES_USER: video_meetings
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video_meetings}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_meetings -d video_meetings"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
